server.port=8085

app.jwt.secret=change-this-to-a-long-random-secret-at-least-32-bytes-in-production
app.jwt.expiration-ms=86400000

spring.application.name=agritech-gateway

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.httpclient.wiretap=false
spring.cloud.gateway.httpserver.wiretap=false

spring.cloud.gateway.routes[0].id=auth-route
spring.cloud.gateway.routes[0].uri=lb://precision-agri-platform
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[1].id=backend-api-route
spring.cloud.gateway.routes[1].uri=lb://precision-agri-platform
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[2].id=h2-console-route
spring.cloud.gateway.routes[2].uri=lb://precision-agri-platform
spring.cloud.gateway.routes[2].predicates[0]=Path=/h2-console/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[3].id=websocket-route
spring.cloud.gateway.routes[3].uri=lb:ws://precision-agri-platform
spring.cloud.gateway.routes[3].predicates[0]=Path=/ws/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Agritech Gateway
info.app.description=API Gateway for Agritech Platform
info.app.version=1.0.0
info.service.port=8085
