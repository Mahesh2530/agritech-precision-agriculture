server:
  port: 8085

app:
  jwt:
    secret: "change-this-to-a-long-random-secret-at-least-32-bytes-in-production"
    expiration-ms: 86400000

spring:
  application:
    name: agritech-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      httpclient:
        wiretap: false
      httpserver:
        wiretap: false
      routes:
        - id: auth-route
          uri: lb://precision-agri-platform
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: backend-api-route
          uri: lb://precision-agri-platform
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=0

        - id: h2-console-route
          uri: lb://precision-agri-platform
          predicates:
            - Path=/h2-console/**
          filters:
            - StripPrefix=0

        - id: websocket-route
          uri: lb:ws://precision-agri-platform
          predicates:
            - Path=/ws/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

